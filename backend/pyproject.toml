[project]
name = "swing-trader"
version = "0.1.0"
description = "NASDAQ-100 swing trade signal engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "apscheduler>=3.10",
  "yfinance>=0.2.50",
  "pandas>=2.2",
  "numpy>=2.1",
  "pandas-ta-classic>=0.4.0",
  "feedparser>=6.0",
  "httpx>=0.28",
  "vaderSentiment>=3.3",
  "python-dotenv>=1.0",
  "scipy>=1.13",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swing_trader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]
# '×' (U+00D7) is intentional math notation in strategy docs/labels (e.g. "k×ATR").
allowed-confusables = ["×"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
